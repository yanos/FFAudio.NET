name: CI

# Keep build, package verification, and publishing in one artifact chain.
# Pushing a v* tag supplies the MinVer release version and enables publishing.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Build and exercise each platform-specific native artifact.
  test:
    name: Build and test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            platform: linux
            artifact: ffaudio-Linux
            artifact-path: native/artifacts/
          - name: macOS
            os: macos-latest
            platform: macos
            artifact: ffaudio-macOS
            artifact-path: native/artifacts/
          - name: Windows
            os: windows-latest
            platform: windows
            artifact: ffaudio-Windows
            artifact-path: native/artifacts/
          - name: iOS Simulator
            os: macos-latest
            platform: ios
            mobile: true
            artifact: ffaudio-iOS
            artifact-path: native/artifacts/ios/
          - name: Android emulator
            os: ubuntu-latest
            platform: android
            mobile: true
            artifact: ffaudio-Android
            artifact-path: native/artifacts/android/
    runs-on: ${{ matrix.os }}

    steps:
      # MinVer requires tags and commit height.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Tests target both supported runtimes.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          cache: true
          cache-dependency-path: |
            src/FFAudio.NET/FFAudio.NET.csproj
            tests/FFAudio.Tests/FFAudio.Tests.csproj

      # Distro FFmpeg is used only for development-path testing.
      - name: Build ffaudio (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libavformat-dev libavcodec-dev libavutil-dev libswresample-dev
          native/linux/build.sh

      - name: Build ffaudio (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew install ffmpeg
          native/macos/build.sh

      # The script downloads the pinned LGPL Windows build.
      - name: Build ffaudio (Windows)
        if: matrix.platform == 'windows'
        run: ./native/windows/build.ps1
        shell: pwsh

      # Only the repository-selected Windows build must pass the LGPL gate here.
      - name: Run tests
        if: ${{ !matrix.mobile }}
        run: dotnet test FFAudio.NET.slnx --configuration Release
        env:
          FFAUDIO_REQUIRE_LGPL: ${{ runner.os == 'Windows' && '1' || '' }}

      # Exercise an ordinary application load context, not only the test host.
      - name: Run the checks as an app
        if: ${{ !matrix.mobile }}
        run: dotnet run --project tests/checks/FFAudio.Checks.Desktop --configuration Release

      # Desktop packages use self-contained LGPL builds, not runner-local FFmpeg.
      - name: Cache the static FFmpeg
        if: matrix.platform == 'linux' || matrix.platform == 'macos'
        uses: actions/cache@v4
        with:
          path: |
            native/macos/ffmpeg/prefix
            native/linux/ffmpeg/prefix
          key: ffmpeg-host-${{ runner.os }}-${{ hashFiles('native/host-ffmpeg.sh', 'native/codec-set.sh') }}

      # FFmpeg's Linux x86 assembly requires nasm.
      - name: Install nasm (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get install -y nasm

      - name: Build the shipping native (Linux)
        if: matrix.platform == 'linux'
        run: native/linux/build.sh --static

      - name: Build the shipping native (macOS)
        if: matrix.platform == 'macos'
        run: native/macos/build.sh --static

      # Validate decoding and license metadata on the exact shipping native.
      - name: Run the checks against the shipping native
        if: matrix.platform == 'linux' || matrix.platform == 'macos'
        run: dotnet run --project tests/checks/FFAudio.Checks.Desktop --configuration Release
        env:
          FFAUDIO_REQUIRE_LGPL: 1

      # Mobile runners verify embedded-native loading and AOT callbacks at runtime.
      - name: Install the mobile workload
        if: matrix.mobile
        run: dotnet workload install ${{ matrix.platform }}

      - name: Cache the cross-compiled FFmpeg
        if: matrix.mobile
        uses: actions/cache@v4
        with:
          path: native/${{ matrix.platform }}/ffmpeg/prefix
          key: ffmpeg-${{ matrix.platform }}-${{ hashFiles(format('native/{0}/build-ffmpeg.sh', matrix.platform), 'native/codec-set.sh') }}

      - name: Build FFmpeg (iOS)
        if: matrix.platform == 'ios'
        run: native/ios/build-ffmpeg.sh

      - name: Build ffaudio (iOS)
        if: matrix.platform == 'ios'
        run: native/ios/build.sh

      # Build, install, launch, and report the simulator tally.
      - name: Run the checks (iOS)
        if: matrix.platform == 'ios'
        run: tests/checks/FFAudio.Checks.iOS/run.sh

      # Map the runner's NDK path to the standard variable.
      - name: Build FFmpeg (Android)
        if: matrix.platform == 'android'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          native/android/build-ffmpeg.sh

      - name: Build ffaudio (Android)
        if: matrix.platform == 'android'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          native/android/build.sh

      # Grant the emulator access to KVM acceleration.
      - name: Let the emulator use KVM
        if: matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Let the action own the emulator; the script reuses its serial.
      - name: Run the checks (Android)
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot-load -gpu swiftshader_indirect
          script: FFAUDIO_ANDROID_SERIAL=emulator-5554 tests/checks/FFAudio.Checks.Android/run.sh

      # Upload each verified native under a unique artifact name for packing.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  # Pack every green commit so packaging failures appear before release tags.
  pack:
    name: Pack
    needs: test
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Restore MinVer, then query single properties for plain-text outputs.
      - name: Resolve the version
        id: version
        run: |
          dotnet restore src/FFAudio.NET/FFAudio.NET.csproj
          version=$(dotnet msbuild src/FFAudio.NET/FFAudio.NET.csproj -target:MinVer -getProperty:Version)
          prerelease=$(dotnet msbuild src/FFAudio.NET/FFAudio.NET.csproj -target:MinVer -getProperty:MinVerPreRelease)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          if [ -z "$prerelease" ]; then
            echo "$version is an official release" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$version is a pre-release ($prerelease)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Package the exact native artifacts exercised by the test matrix.
      - name: Collect the natives
        uses: actions/download-artifact@v4
        with:
          pattern: ffaudio-*
          path: artifacts/natives

      # Restore artifacts to the paths expected by packaging projects.
      - name: Lay the natives out
        run: |
          set -euo pipefail
          mkdir -p native/artifacts
          for os in Linux macOS Windows; do
            cp -R artifacts/natives/ffaudio-$os/. native/artifacts/
          done
          mkdir -p native/artifacts/ios native/artifacts/android
          cp -R artifacts/natives/ffaudio-iOS/. native/artifacts/ios/
          cp -R artifacts/natives/ffaudio-Android/. native/artifacts/android/
          find native/artifacts -maxdepth 2 -type d

      - name: Pack
        run: |
          dotnet pack src/FFAudio.NET/FFAudio.NET.csproj --configuration Release -p:ContinuousIntegrationBuild=true --output artifacts/nupkg
          for project in packaging/*/*.csproj; do
            dotnet pack "$project" --configuration Release -p:ContinuousIntegrationBuild=true --output artifacts/nupkg
          done

      # Log package contents, including native payload presence.
      - name: Show what was packed
        run: |
          for package in artifacts/nupkg/*.nupkg; do
            echo "=== $package ==="
            unzip -l "$package"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/nupkg/*
          if-no-files-found: error

  # Exercise the packed binding and native payloads as consumers receive them.
  package:
    name: Test package (${{ matrix.name }})
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            platform: linux
          - name: macOS
            os: macos-latest
            platform: macos
          - name: Windows
            os: windows-latest
            platform: windows
          - name: iOS Simulator
            os: macos-latest
            platform: ios
            mobile: true
          - name: Android emulator
            os: ubuntu-latest
            platform: android
            mobile: true
    runs-on: ${{ matrix.os }}

    env:
      FFAUDIO_PACKAGE_VERSION: ${{ needs.pack.outputs.version }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install the mobile workload
        if: matrix.mobile
        run: dotnet workload install ${{ matrix.platform }}

      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts/nupkg

      # Add the packed artifacts as a visible local feed while retaining nuget.org.
      - name: Point NuGet at what was packed
        run: |
          dotnet new nugetconfig
          dotnet nuget add source "${{ github.workspace }}/artifacts/nupkg" --name packed --configfile nuget.config
          cat nuget.config

      # Ensure package tests cannot resolve a native from the source tree.
      - name: Check nothing native is in the tree
        run: |
          if [ -e native/artifacts ]; then
            echo "::error::native/artifacts exists - this run would not be testing the package"
            exit 1
          fi

      # Every shipped desktop payload must report LGPL terms.
      - name: Test package
        if: ${{ !matrix.mobile }}
        env:
          FFAUDIO_REQUIRE_LGPL: 1
        run: dotnet run --project tests/checks/FFAudio.Checks.Desktop --configuration Release -p:FFAudioPackageVersion="$FFAUDIO_PACKAGE_VERSION"

      - name: Test package
        if: matrix.platform == 'ios'
        run: tests/checks/FFAudio.Checks.iOS/run.sh

      # Grant the action-managed emulator access to KVM.
      - name: Let the emulator use KVM
        if: matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test package
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot-load -gpu swiftshader_indirect
          script: FFAUDIO_ANDROID_SERIAL=emulator-5554 tests/checks/FFAudio.Checks.Android/run.sh

  # Publish tested package bytes only after all package checks pass on a v* tag.
  publish:
    name: Publish to NuGet
    needs: [pack, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    # NuGet trusted publishing exchanges this job's OIDC token for short-lived access.
    environment: release
    permissions:
      id-token: write

    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts/nupkg

      # Refuse publication if MinVer's packed version differs from the tag.
      - name: Check the version against the tag
        env:
          VERSION: ${{ needs.pack.outputs.version }}
          PRERELEASE: ${{ needs.pack.outputs.prerelease }}
        run: |
          expected="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME wants $expected, MinVer computed $VERSION - refusing to publish"
            exit 1
          fi
          ls -l artifacts/nupkg
          if [ -z "$PRERELEASE" ]; then
            echo "Publishing $VERSION as an official release" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Publishing $VERSION as a pre-release ($PRERELEASE)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # NUGET_USER owns the configured trusted-publishing policy.
      - name: Log in to NuGet
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Allow safe retries after a partial push; symbol packages are sent alongside.
      - name: Push to NuGet
        run: |
          dotnet nuget push 'artifacts/nupkg/*.nupkg' \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
            --skip-duplicate
