name: CI

# One workflow rather than two, because `needs:` and artifacts only reach
# across jobs of the same run. A separate Publish workflow firing on the same
# tag push cannot depend on this one's tests or download what it built - it can
# only repeat them and hope the second answer matches the first. Chained here,
# the package that reaches nuget.org is the exact file a green run produced.
#
#     push / PR       test on three desktops, run the same checks on an iOS
#                     simulator and an Android emulator, then pack behind all five
#     push of v*      the same, and then publish what was packed
#
# A version is a decision, and `git tag v1.2.3` followed by pushing the tag is
# where it gets made. MinVer turns the tag into the package version, so there
# is no file to edit and nothing that can disagree with the tag:
#
#     v1.2.3          an official release
#     v1.2.3-rc.1     a pre-release, and NuGet shows it as one
#
# Neither form is special-cased below. The difference is entirely MinVer's,
# read out of the tag, and NuGet's own definition of a pre-release is the
# hyphen in the version string.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Build the façade and run the suite against it, once per desktop platform.
  #
  # There is no "fast suite" to run without a native here, and that is on
  # purpose: every test in DecoderTests is tagged RequiresNative, because a
  # decode library whose tests do not decode anything is testing its own
  # opinions. So the native build is not an optional step that a filter can
  # route around - if it fails, the job fails, which is the point.
  #
  # Three platforms rather than one because the native is a different artifact
  # on each: pkg-config against a distro FFmpeg on Linux, against Homebrew's
  # on macOS, and a pinned LGPL download linked with MSVC on Windows. Those
  # are three ways for the same C to stop compiling.
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      # Full history, so MinVer sees the tags and commit height it versions
      # these binaries from. actions/checkout defaults to depth 1, which
      # silently yields MinVer's 0.0.0-alpha.0 fallback instead.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            src/FFAudio.NET/FFAudio.NET.csproj
            tests/FFAudio.Tests/FFAudio.Tests.csproj

      # A distro FFmpeg is GPL-enabled, which makes it a development build
      # only - fine for deciding whether the façade decodes, not for anything
      # shipped. See NOTICE.
      - name: Build ffaudio (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libavformat-dev libavcodec-dev libavutil-dev libswresample-dev
          native/linux/build.sh

      - name: Build ffaudio (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg
          native/macos/build.sh

      # No cross-compile and nothing to install: the script downloads a pinned
      # LGPL Windows build of FFmpeg and links against its import libraries,
      # which is why this is seconds where the mobile equivalents are tens of
      # minutes.
      - name: Build ffaudio (Windows)
        if: runner.os == 'Windows'
        run: ./native/windows/build.ps1
        shell: pwsh

      # The tests find the artifact through Native.Resolve's development walk,
      # out of native/artifacts/<platform>/ - the same path the step above
      # wrote it to, and the same one a developer's build-all.sh run uses.
      # Nothing is copied anywhere for CI's benefit.
      # Windows alone is held to it, and that is not an oversight. Its FFmpeg
      # is a pinned LGPL build this repo chose; Linux's and macOS's come from
      # apt and brew, which ship GPL-enabled FFmpeg and are development
      # dependencies rather than shipping ones. So this gate is a check that
      # the pinned Windows asset is still what its name says - a swapped or
      # renamed release would otherwise be discovered by a lawyer rather than
      # by a build. See FFmpegBuildTests.
      - name: Run tests
        run: dotnet test FFAudio.NET.slnx --configuration Release
        env:
          FFAUDIO_REQUIRE_LGPL: ${{ runner.os == 'Windows' && '1' || '' }}

      # The same checks again, this time from an ordinary application instead
      # of a test host. DeviceChecksTests has already run them under xUnit a
      # step ago, so this is not about the checks - it is about whether a
      # console app with a project reference and a Main can use this library
      # at all. Restore, native resolution and assembly loading all differ
      # between an app and a test host, and "something an app does that a test
      # does not" is the shape of both bugs this library has had on iOS.
      #
      # Its exit code is its tally, so nothing here has to parse the output.
      - name: Run the checks as an app
        run: dotnet run --project checks/FFAudio.Checks.Desktop --configuration Release

      # Everything above builds against the FFmpeg this runner happens to have,
      # which is the right thing to test and the wrong thing to ship. A dylib
      # linked against Homebrew records /opt/homebrew/opt/ffmpeg/lib in its own
      # load commands, and an .so linked against apt's records a soname the
      # distro owns; copied into a NuGet and restored on a machine without that
      # exact FFmpeg, neither one loads. That is not hypothetical - it is what
      # the first real consumer of FFAudio.NET.macOS hit, on a Mac whose FFmpeg
      # came from MacPorts.
      #
      # So the artifact this job uploads is built a second time, statically,
      # against an LGPL FFmpeg the repo builds itself - and the checks are run
      # again against *that*, because the binary a package ships should be one
      # that decoded something. The first build is not wasted: linking the
      # system FFmpeg is the path every developer uses, and a job that only
      # built statically would stop compiling it.
      #
      # Windows is already in this shape without any of it: its FFmpeg is a
      # pinned LGPL download whose four DLLs are copied beside the façade and
      # packed with it, so the payload is self-contained and the libraries stay
      # replaceable. A static MSVC FFmpeg would be a worse answer to a question
      # Windows does not have.
      - name: Cache the static FFmpeg
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            native/macos/ffmpeg/prefix
            native/linux/ffmpeg/prefix
          key: ffmpeg-host-${{ runner.os }}-${{ hashFiles('native/host-ffmpeg.sh', 'native/codec-set.sh') }}

      # FFmpeg's x86 assembly needs an external assembler and configure refuses
      # to guess one. The macOS runner is arm64, where the toolchain's own
      # assembler is enough.
      - name: Install nasm (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y nasm

      - name: Build the shipping native (Linux)
        if: runner.os == 'Linux'
        run: FFAUDIO_STATIC=1 native/linux/build.sh

      - name: Build the shipping native (macOS)
        if: runner.os == 'macOS'
        run: FFAUDIO_STATIC=1 native/macos/build.sh

      # The same checks, against the binary that is about to be packed - and
      # this time the licence gate is on. It could not be before: apt's and
      # brew's FFmpeg are GPL-enabled, which is why only Windows was ever held
      # to it. A build the repo configured itself has no such excuse, and
      # asking the binary rather than the build is the whole point of
      # FFmpegBuild - a configure line does not travel inside a NuGet.
      - name: Run the checks against the shipping native
        if: runner.os != 'Windows'
        run: dotnet run --project checks/FFAudio.Checks.Desktop --configuration Release
        env:
          FFAUDIO_REQUIRE_LGPL: 1

      # The façade this job just proved decodes, downloadable from the run.
      #
      # Nothing downstream consumes these yet: the package carries the
      # binding and no decoder, so a consumer still supplies their own
      # libffaudio (FFAUDIO_LIBRARY, or beside their binary - see the README).
      # Wiring them into a runtimes/<rid>/native/ payload is Phase 6, and this
      # is the half of it that has to exist first - a built native from each
      # platform, in one place, at one commit.
      #
      # Names must differ per job: upload-artifact v4 refuses a second upload
      # under a name that already exists in the run, where v3 merged them.
      - uses: actions/upload-artifact@v4
        with:
          name: ffaudio-${{ runner.os }}
          path: native/artifacts/
          if-no-files-found: error

  # The phones run the checks, on a simulator and an emulator.
  #
  # A cross-compile alone would not be worth much here. Three things this
  # library depends on are green at link time and fatal at launch, and none of
  # them can fail on a desktop: Native.Resolve's iOS branch loading the façade
  # by hand out of Frameworks/ffaudio.framework, the UnmanagedCallersOnly read
  # and seek trampolines OpenStream hands to FFmpeg being AOT-compiled rather
  # than JITted, and libffaudio.so loading out of an APK for whichever ABI the
  # hardware is. So these jobs build the native, build a runner app around it,
  # launch it, and read back the tally it wrote - which is what the two
  # scripts in scripts/ do, unchanged from how they run on a developer's Mac.
  #
  # The expensive half is FFmpeg itself: build-ffmpeg.sh cross-compiles it
  # from source, which is tens of minutes across two iOS slices or three
  # Android ABIs. Both scripts are idempotent - a prefix with a libavformat.a
  # in it is left alone - so caching the prefix makes every run after the
  # first just the façade, which is one translation unit. The key is the
  # script's own hash, because the FFmpeg version and the decoder list are
  # both in it: change either and the cache misses, which is exactly right.
  ios:
    name: Build and test (iOS Simulator)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install the iOS workload
        run: dotnet workload install ios

      - name: Cache the cross-compiled FFmpeg
        uses: actions/cache@v4
        with:
          path: native/ios/ffmpeg/prefix
          key: ffmpeg-ios-${{ hashFiles('native/ios/build-ffmpeg.sh') }}

      - name: Build FFmpeg
        run: native/ios/build-ffmpeg.sh

      - name: Build ffaudio
        run: native/ios/build.sh

      # Builds the runner, installs it on a simulator, launches it and turns
      # the tally into an exit code. The transcript is printed either way -
      # a run that produced no tally prints what there was instead, because
      # "the app wrote nothing" and "six checks failed" are different findings.
      - name: Run the checks
        run: scripts/ios-device-checks.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ffaudio-iOS
          path: native/artifacts/ios/
          if-no-files-found: error

  android:
    name: Build and test (Android emulator)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install the Android workload
        run: dotnet workload install android

      - name: Cache the cross-compiled FFmpeg
        uses: actions/cache@v4
        with:
          path: native/android/ffmpeg/prefix
          key: ffmpeg-android-${{ hashFiles('native/android/build-ffmpeg.sh') }}

      # The runner image ships an NDK already; the scripts want it under the
      # name the NDK's own docs use, which is what a developer machine sets.
      - name: Build FFmpeg
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          native/android/build-ffmpeg.sh

      - name: Build ffaudio
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          native/android/build.sh

      # An x86_64 emulator needs nested virtualisation, and the runner has KVM
      # but does not hand it to an unprivileged process by default. Without
      # this the emulator falls back to software rendering of the whole CPU
      # and times out rather than failing.
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The action owns the emulator's lifecycle and the script is told to use
      # it rather than start one of its own - two `emulator` processes
      # fighting over the same AVD lock is a failure with no useful error.
      # x86_64 here where a developer's Mac is arm64-v8a, which is the point
      # of packaging all three ABIs: which one gets exercised is a property of
      # the hardware, so between the two places these run, two of them do.
      - name: Run the checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot-load -gpu swiftshader_indirect
          script: FFAUDIO_ANDROID_SERIAL=emulator-5554 scripts/android-device-checks.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ffaudio-Android
          path: native/artifacts/android/
          if-no-files-found: error

  # Packing on every push, not only on a tag. A release that discovers its own
  # packaging is broken is a release that has to be re-cut, and the version
  # this produces - MinVer's 0.1.0-alpha.0.<height> for an untagged commit - is
  # a real pre-release, not a placeholder. The artifact is downloadable from
  # the run, so a consumer can try a commit before it is tagged.
  #
  # `needs` gates it on all five platforms, so a commit that stopped compiling
  # on Windows - or stopped cross-compiling for a phone - never produces a
  # package at all.
  pack:
    name: Pack
    needs: [test, ios, android]
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Ask MinVer for the version rather than working it out a second way.
      # This is the same target the pack below runs, so the two cannot
      # disagree, and publishing it as a job output means the tag check
      # downstream compares against what was actually packed rather than
      # against a fresh guess.
      #
      # Two separate single-property calls on purpose: -getProperty returns a
      # bare string for one property and a JSON object for two. The restore is
      # not optional - MinVer's targets arrive with the package, so without it
      # this fails with MSB4057, "the target MinVer does not exist".
      - name: Resolve the version
        id: version
        run: |
          dotnet restore src/FFAudio.NET/FFAudio.NET.csproj
          version=$(dotnet msbuild src/FFAudio.NET/FFAudio.NET.csproj -target:MinVer -getProperty:Version)
          prerelease=$(dotnet msbuild src/FFAudio.NET/FFAudio.NET.csproj -target:MinVer -getProperty:MinVerPreRelease)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          if [ -z "$prerelease" ]; then
            echo "$version is an official release" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$version is a pre-release ($prerelease)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # The natives this run built, back out of the jobs that built them and
      # into the tree at the paths the packaging projects expect. Nothing is
      # rebuilt here: the binaries that go into a package are the ones the
      # test and checks jobs actually exercised, which is the same argument
      # the publish job makes for pushing pack's exact bytes.
      #
      # No `continue-on-error` and no glob: a payload package that packs
      # nothing is the failure mode this whole phase invites, so a missing
      # download must stop the run. EnsurePayloadExists catches it a second
      # time if a download silently produced an empty directory.
      - name: Collect the natives
        uses: actions/download-artifact@v4
        with:
          pattern: ffaudio-*
          path: artifacts/natives

      # download-artifact with a pattern nests each artifact under its own
      # name, which is not where the packaging projects look. The desktop
      # three each carry a platform folder of their own; the mobile two were
      # uploaded as the contents of one.
      - name: Lay the natives out
        run: |
          set -euo pipefail
          mkdir -p native/artifacts
          for os in Linux macOS Windows; do
            cp -R artifacts/natives/ffaudio-$os/. native/artifacts/
          done
          mkdir -p native/artifacts/ios native/artifacts/android
          cp -R artifacts/natives/ffaudio-iOS/. native/artifacts/ios/
          cp -R artifacts/natives/ffaudio-Android/. native/artifacts/android/
          find native/artifacts -maxdepth 2 -type d

      - name: Pack
        run: |
          dotnet pack src/FFAudio.NET/FFAudio.NET.csproj --configuration Release -p:ContinuousIntegrationBuild=true --output artifacts/nupkg
          for project in packaging/*/*.csproj; do
            dotnet pack "$project" --configuration Release -p:ContinuousIntegrationBuild=true --output artifacts/nupkg
          done

      # What went into the packages, in the log, so a build's version and
      # dependencies are readable without downloading anything - and, for the
      # payload packages, that they are not empty.
      - name: Show what was packed
        run: |
          for package in artifacts/nupkg/*.nupkg; do
            echo "=== $package ==="
            unzip -l "$package"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/nupkg/*
          if-no-files-found: error

  # The package, used the way a consumer uses it, on an iOS Simulator.
  #
  # Everything above this proves the source works. Nothing above it proves the
  # package does, and on iOS those are further apart than anywhere else: the
  # framework does not arrive by RID, it arrives because FFAudio.NET.iOS ships
  # a .targets file that declares a <NativeReference> in the consuming project,
  # picking a slice off the RuntimeIdentifier. That file is not compiled, not
  # tested and not run by anything in this repo - it runs for the first time
  # inside somebody else's build, and if it is wrong the symptom there is a
  # link error or an app that dies at launch.
  #
  # So this rebuilds the same runner the ios job built, with the tree's own
  # framework and project reference switched off and the two packages switched
  # on, and launches it. Same checks, same tally, same exit code - the only
  # difference is where the binding and the native came from, which is the
  # whole question.
  #
  # It needs `pack` rather than `ios`, and it downloads the nupkg artifact
  # rather than building anything native: the bytes under test are the ones
  # that would be pushed to nuget.org, not a second build of the same commit.
  # Which also means this is the job that would notice a packaging change that
  # packs an empty framework, or drops the .targets file, or names the wrong
  # buildTransitive folder - none of which anything else here can see.
  ios-package:
    name: Build and test (iOS package)
    needs: pack
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install the iOS workload
        run: dotnet workload install ios

      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts/nupkg

      # A local folder feed, and nuget.org left in place because the binding
      # package has real dependencies to restore. The source is added to a
      # config in the repo root rather than the user profile so the whole
      # thing is visible in the log if it goes wrong.
      - name: Point NuGet at what was packed
        run: |
          dotnet new nugetconfig
          dotnet nuget add source "$PWD/artifacts/nupkg" --name packed --configfile nuget.config
          cat nuget.config

      - name: Run the checks against the package
        env:
          FFAUDIO_PACKAGE_VERSION: ${{ needs.pack.outputs.version }}
        run: scripts/ios-device-checks.sh

  # Tags only, and only after every test job, the pack above, and the run that
  # used what it packed have gone green - `needs` is what makes that a
  # dependency rather than a coincidence of timing. A push to nuget.org cannot be taken back, only unlisted, so the
  # one irreversible step in this repo does not race anything.
  #
  # There is no checkout and no build here, deliberately. This job downloads
  # the package `pack` produced and pushes those exact bytes; the thing that
  # gets published is therefore the thing the run tested, not a second
  # compilation of the same commit that nobody looked at.
  publish:
    name: Publish to NuGet
    needs: [pack, ios-package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    # Trusted publishing: there is no long-lived API key anywhere. nuget.org
    # trusts an OIDC token GitHub mints for this job, and only this job - the
    # policy on nuget.org names this repository, this workflow file and this
    # environment, so a token from any other workflow, or from a job outside
    # the environment, is refused. id-token: write is what lets the job ask
    # for that token; the workflow-wide contents: read does not carry over
    # once a job declares permissions of its own, and nothing here needs it.
    #
    # The environment is also where a required reviewer or a tag-only
    # deployment rule would go, in the repository's settings rather than here.
    environment: release
    permissions:
      id-token: write

    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts/nupkg

      # The tag says what version this is meant to be; MinVer, back in `pack`,
      # said what version was actually built. They agree unless something went
      # wrong upstream - a checkout that lost its history yields 0.0.0-alpha.0
      # and would otherwise be published under a v1.2.3 tag without complaint.
      # Cheaper to find out here than to unlist it afterwards.
      - name: Check the version against the tag
        env:
          VERSION: ${{ needs.pack.outputs.version }}
          PRERELEASE: ${{ needs.pack.outputs.prerelease }}
        run: |
          expected="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME wants $expected, MinVer computed $VERSION - refusing to publish"
            exit 1
          fi
          ls -l artifacts/nupkg
          if [ -z "$PRERELEASE" ]; then
            echo "Publishing $VERSION as an official release" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Publishing $VERSION as a pre-release ($PRERELEASE)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Trades the job's OIDC token for an API key that lives for an hour and
      # can push only the packages this account owns. NUGET_USER is the
      # nuget.org account name - the profile, not an email - that owns the
      # trusted publishing policy.
      - name: Log in to NuGet
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # --skip-duplicate so re-running a failed job after a partial push is
      # harmless rather than a hard error on a version that is already up.
      # The .snupkg beside each package goes with it; `dotnet nuget push`
      # sends symbol packages alongside the ones they belong to.
      - name: Push to NuGet
        run: |
          dotnet nuget push 'artifacts/nupkg/*.nupkg' \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
            --skip-duplicate
